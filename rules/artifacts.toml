# ---- Unique-state file names -------------------------------------------------------------
# Matched on the file name only (never the contents), ignoring case. A pattern is `name`,
# `*suffix` or `prefix*`. The first match wins, so the plain entries come before the
# fixture-prone ones. A hit makes the enclosing regenerable or cache directory ask, and through
# the plan every repo and directory around it.
[[state_file]]
pattern = "*.tfstate"
kind = "Terraform state"

[[state_file]]
pattern = "terraform.tfstate.*"
kind = "Terraform state"

[[state_file]]
pattern = "*.tfvars"
kind = "Terraform variable values"

[[state_file]]
pattern = ".env"
kind = "environment settings (.env)"

[[state_file]]
pattern = ".env.*"
kind = "environment settings (.env)"
except = [".env.example", ".env.sample", ".env.template", ".env.dist"]

[[state_file]]
pattern = "id_rsa"
kind = "a private SSH key"

[[state_file]]
pattern = "id_ed25519"
kind = "a private SSH key"

[[state_file]]
pattern = "*.sqlite"
kind = "a local database"
fixture_prone = true

[[state_file]]
pattern = "*.sqlite3"
kind = "a local database"
fixture_prone = true

[[state_file]]
pattern = "*.db"
kind = "a local database"
fixture_prone = true

[[state_file]]
pattern = "*.pem"
kind = "a certificate or private key"
fixture_prone = true

[[state_file]]
pattern = "*.key"
kind = "a private key"
fixture_prone = true

[[state_file]]
pattern = "*.keystore"
kind = "a key store"
fixture_prone = true

[[state_file]]
pattern = "*.jks"
kind = "a key store"
fixture_prone = true

[[state_file]]
pattern = "*.p12"
kind = "a certificate bundle with its private key"
fixture_prone = true

# ---- Output files ------------------------------------------------------------------------
# Files with these extensions are produced work, not artifacts. Found inside any regenerable or
# cache directory they are listed individually and the directory is not offered for removal,
# unless the file sits in an installed package's directory and is below the output threshold.
[outputs]
extensions = [
    # video
    "mp4", "mov", "mkv", "avi", "webm", "m4v", "wmv", "flv",
    # audio
    "mp3", "wav", "flac", "aac", "m4a", "ogg", "opus", "aiff",
    # image projects
    "psd", "psb", "ai", "xcf", "kra", "blend", "sketch", "indd", "afdesign",
    # archives and disk images
    "zip", "tar", "gz", "tgz", "bz2", "xz", "7z", "rar", "zst", "iso", "dmg",
    # model weights
    "safetensors", "ckpt", "pt", "pth", "onnx", "gguf", "h5", "tflite",
    # virtual machine disks
    "vmdk", "vdi", "vhd", "vhdx", "qcow2",
    # database dumps and local databases
    "sql", "dump", "bak", "sqlite", "sqlite3", "mdb", "db", "duckdb",
    # images and documents
    "png", "jpg", "jpeg", "gif", "webp", "bmp", "tif", "tiff", "exr", "heic", "dng", "raw", "pdf",
    # datasets and arrays
    "csv", "tsv", "parquet", "npy", "npz", "jsonl", "arrow", "feather", "hdf5", "nc",
    # more model weights
    "bin", "keras", "npz",
]

# ---- Loose code --------------------------------------------------------------------------
# A directory outside any repo that holds one of these manifests, or source files directly,
# is "loose code": the user is asked what to do with it.
[loose_code]
manifests = [
    "package.json", "Cargo.toml", "pyproject.toml", "setup.py", "requirements.txt", "Pipfile",
    "go.mod", "pom.xml", "build.gradle", "build.gradle.kts", "settings.gradle", "Gemfile",
    "composer.json", "pubspec.yaml", "mix.exs", "CMakeLists.txt", "Makefile", "Package.swift",
    "*.csproj", "*.fsproj", "*.sln", "*.xcodeproj",
]
source_extensions = [
    "rs", "py", "js", "jsx", "ts", "tsx", "go", "java", "kt", "c", "cc", "cpp", "h", "hpp",
    "cs", "rb", "php", "swift", "m", "scala", "sh", "lua", "ex", "exs", "dart", "zig",
]
