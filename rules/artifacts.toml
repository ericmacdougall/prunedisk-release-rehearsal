# Artifact and cache rules for disk-cleaner. This file is data: extend it without touching code.
#
# [[rule]] fields
#   name          directory name; a name with "/" matches the trailing path components
#   markers       entries (files or directories) that must exist beside the directory, that is,
#                 in its parent. A marker further up does not count. "*.ext" matches by suffix.
#                 Empty list means the name alone is enough (use only for names that are never
#                 anything else).
#   class         "regenerable" (rebuilt by the project's tooling) or "cache" (re-downloaded)
#   scan_outputs  true for build output directories: output files (video, archives, model
#                 weights...) of any size anywhere in them are listed, even inside a package
#                 directory. Every artifact, whatever this says, asks when it holds a listed
#                 output: one of any size that is not in an installed package's directory (see
#                 fixture_files, fixture_dirs), or one of at least the scan's output threshold.
#                 Dependency directories (node_modules, venv) leave this false, so the small
#                 fixtures packages ship inside their own package directories are not listed.
#   note          one line shown to the user
#   ask           a reason (read after "it", e.g. "can hold ..."): the directory can hold content
#                 that exists nowhere else, so it is shown but never offered for removal
#   ask_if_contains
#                 entries that, found directly inside the directory, show it is not what the rule
#                 describes (a user-level home rather than a project cache); it then asks
#   fixture_files, fixture_dirs
#                 evidence that a file is part of an installed package, for directories of
#                 third-party package contents. Packages ship key, certificate and database
#                 files as test fixtures, so a `fixture_prone` [[state_file]] name is exempt
#                 only when a directory between the file and the artifact root (the root itself
#                 excluded) holds a `fixture_files` entry (node_modules: package.json), or the
#                 file sits in a package directory directly below a `fixture_dirs` name
#                 (virtual environments: site-packages). Without such evidence, and in every
#                 rule that defines none, those names are unique state and the directory asks.
#                 The same evidence decides outputs: an output file below the scan's output
#                 threshold is listed (and the directory asks) unless it has that evidence.
#
# [[state_file]] (end of file): file names that mean "this is not only generated files". They
# are looked for anywhere under a regenerable or cache directory, and the same rules that carry
# `ask` / `ask_if_contains` are applied to directories nested inside it.
#
# A cache or "regenerable" directory that tools also use to store what the user made (locally
# installed packages, settings, credentials, state) must carry `ask`.
#
# Ambiguous names (dist, build, out, target, bin, obj, coverage, Library, deps) always carry markers.

# ---- Node / JavaScript -------------------------------------------------------------------
[[rule]]
name = "node_modules"
markers = ["package.json"]
class = "regenerable"
note = "npm, pnpm and yarn dependencies; restored by an install"
fixture_files = ["package.json"]

[[rule]]
name = ".next"
markers = ["package.json"]
class = "regenerable"
scan_outputs = true
note = "Next.js build output and cache"

[[rule]]
name = ".nuxt"
markers = ["package.json"]
class = "regenerable"
scan_outputs = true
note = "Nuxt build output"

[[rule]]
name = ".output"
markers = ["nuxt.config.ts", "nuxt.config.js"]
class = "regenerable"
scan_outputs = true
note = "Nuxt/Nitro build output"

[[rule]]
name = ".turbo"
markers = ["package.json", "turbo.json"]
class = "cache"
note = "Turborepo cache"

[[rule]]
name = ".svelte-kit"
markers = ["package.json"]
class = "regenerable"
scan_outputs = true
note = "SvelteKit build output"

[[rule]]
name = ".parcel-cache"
markers = ["package.json"]
class = "cache"
note = "Parcel cache"

[[rule]]
name = ".angular"
markers = ["angular.json"]
class = "cache"
note = "Angular CLI cache"

[[rule]]
name = ".nyc_output"
markers = ["package.json"]
class = "regenerable"
note = "nyc coverage data"

[[rule]]
name = "dist"
markers = ["package.json", "pyproject.toml", "setup.py"]
class = "regenerable"
scan_outputs = true
note = "build output"

[[rule]]
name = "build"
markers = ["package.json", "build.gradle", "build.gradle.kts", "CMakeLists.txt", "setup.py", "pubspec.yaml"]
class = "regenerable"
scan_outputs = true
note = "build output"

[[rule]]
name = "out"
markers = ["package.json", "tsconfig.json", "build.gradle", "build.gradle.kts"]
class = "regenerable"
scan_outputs = true
note = "build output"

[[rule]]
name = "coverage"
markers = ["package.json", "pyproject.toml", ".coveragerc"]
class = "regenerable"
scan_outputs = true
note = "test coverage reports"

# ---- Rust --------------------------------------------------------------------------------
[[rule]]
name = "target"
markers = ["Cargo.toml"]
class = "regenerable"
scan_outputs = true
note = "Cargo build output"

[[rule]]
name = ".cargo/registry"
markers = []
class = "cache"
note = "Cargo crate registry cache"
fixture_files = ["Cargo.toml"]

[[rule]]
name = ".cargo/git"
markers = []
class = "cache"
note = "Cargo git dependency checkouts"
fixture_files = ["Cargo.toml"]

# ---- JVM ---------------------------------------------------------------------------------
[[rule]]
name = "target"
markers = ["pom.xml", "build.sbt"]
class = "regenerable"
scan_outputs = true
note = "Maven or sbt build output"

[[rule]]
name = ".gradle"
markers = ["build.gradle", "build.gradle.kts", "settings.gradle", "settings.gradle.kts"]
class = "regenerable"
note = "Gradle project cache"
# A build file in the home directory makes ~/.gradle (the Gradle user home) look like a project
# cache; the user home holds gradle.properties (often credentials) and init scripts.
ask_if_contains = ["gradle.properties", "init.d", "init.gradle", "init.gradle.kts", "caches", "wrapper"]

[[rule]]
name = ".gradle/caches"
markers = []
class = "cache"
note = "Gradle user cache"

[[rule]]
name = ".m2/repository"
markers = []
class = "cache"
note = "Maven local repository"
ask = "can hold artifacts installed with mvn install or install:install-file that exist nowhere else; not offered for removal until each artifact is shown to be downloadable"

